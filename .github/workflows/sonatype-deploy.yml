name: Maven Library Publish
permissions:
  contents: read

on:
  release:
    types: [created]
  workflow_dispatch:  

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - uses: actions/checkout@v7

      # Set up JDK 25
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Set up Maven (See https://chromium.googlesource.com/external/github.com/google/turbine/%2B/c0f5b76aa97395ca84853c6a575b739dfe846443)
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16

      # Configure Maven settings with OSSRH credentials
      - name: Configure Maven settings
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_TOKEN_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_TOKEN_PASSWORD }}
        run: |
          mkdir -p $HOME/.m2
          cat <<EOF > $HOME/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${OSSRH_USERNAME}</username>
                <password>${OSSRH_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Deploy to OSSRH staging with Maven GPG Plugin signing
      - name: Deploy to OSSRH staging
        env:
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_ID }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -Psign-artifacts clean deploy
