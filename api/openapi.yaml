openapi: 3.1.0
info:
  title: yabb-api API
  version: 1.0.0-SNAPSHOT
servers:
- url: /
tags:
- name: Birthday
- name: Birthday Schedule
- name: Guild
paths:
  /api/v1/birthday:
    patch:
      operationId: updateBirthday
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BirthdayDTO"
        required: true
      responses:
        "204":
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation Errors
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Birthday or BirthdaySchedule not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Update a Birthday
      tags:
      - Birthday
      x-content-type: application/json
      x-accepts:
      - application/json
    post:
      operationId: saveBirthday
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BirthdayDTO"
        required: true
      responses:
        "201":
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation Errors
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Constraint Violation Errors
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Save a Birthday
      tags:
      - Birthday
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/birthday/schedule/active:
    get:
      operationId: getActiveSchedules
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BirthdayScheduleDTO"
                type: array
                default: null
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Get a list of birthday schedules overdue by at most 24 hours
      tags:
      - Birthday Schedule
      x-accepts:
      - application/json
  /api/v1/birthday/schedule/advance/{guildId}/{userId}:
    patch:
      operationId: advance
      parameters:
      - explode: false
        in: path
        name: guildId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      responses:
        "204":
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation Errors
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Schedule not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Update birthday schedule for next year
      tags:
      - Birthday Schedule
      x-accepts:
      - application/json
  /api/v1/birthday/schedule/expired:
    get:
      operationId: getExpiredSchedules
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BirthdayScheduleDTO"
                type: array
                default: null
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Get a list of birthday schedules overdue by more than 24 hours
      tags:
      - Birthday Schedule
      x-accepts:
      - application/json
  /api/v1/birthday/schedule/upcoming:
    get:
      operationId: getUpcomingSchedules
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BirthdayScheduleDTO"
                type: array
                default: null
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Get a list of birthday schedules due in the future
      tags:
      - Birthday Schedule
      x-accepts:
      - application/json
  /api/v1/birthday/schedule/{guildId}/{userId}:
    get:
      operationId: getSchedule
      parameters:
      - explode: false
        in: path
        name: guildId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BirthdayScheduleDTO"
                type: array
                default: null
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Get birthday schedule for a particular guild and user
      tags:
      - Birthday Schedule
      x-accepts:
      - application/json
  /api/v1/birthday/{guildId}:
    delete:
      operationId: deleteBirthdays
      parameters:
      - explode: false
        in: path
        name: guildId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      responses:
        "200":
          content:
            text/plain: {}
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation Errors
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Delete all Birthdays belonging to a Guild
      tags:
      - Birthday
      x-accepts:
      - application/json
      - text/plain
    get:
      operationId: getBirthdays
      parameters:
      - explode: false
        in: path
        name: guildId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BirthdayDTO"
                type: array
                default: null
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation Errors
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Get Birthdays for a Guild
      tags:
      - Birthday
      x-accepts:
      - application/json
  /api/v1/birthday/{guildId}/{userId}:
    delete:
      operationId: deleteBirthday
      parameters:
      - explode: false
        in: path
        name: guildId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      responses:
        "204":
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation Errors
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Birthday not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Delete a User's Birthday
      tags:
      - Birthday
      x-accepts:
      - application/json
    get:
      operationId: getBirthday
      parameters:
      - explode: false
        in: path
        name: guildId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BirthdayDTO"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation Errors
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Birthday or BirthdaySchedule not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Get Birthday for a User in a Guild
      tags:
      - Birthday
      x-accepts:
      - application/json
  /api/v1/guild:
    get:
      operationId: getAllGuilds
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/GuildDTO"
                type: array
                default: null
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Get All Guilds
      tags:
      - Guild
      x-accepts:
      - application/json
    patch:
      operationId: updateGuild
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuildDTO"
        required: true
      responses:
        "204":
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation Errors
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Guild not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Update a Guild
      tags:
      - Guild
      x-content-type: application/json
      x-accepts:
      - application/json
    post:
      operationId: saveGuild
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuildDTO"
        required: true
      responses:
        "201":
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation Errors
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Constraint Violation Errors
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Save a Guild
      tags:
      - Guild
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/guild/{guildId}:
    delete:
      operationId: deleteGuild
      parameters:
      - explode: false
        in: path
        name: guildId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      responses:
        "204":
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation Errors
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Guild not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Delete a Guild
      tags:
      - Guild
      x-accepts:
      - application/json
    get:
      operationId: getGuild
      parameters:
      - explode: false
        in: path
        name: guildId
        required: true
        schema:
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildDTO"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation Errors
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Guild not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Get a Guild
      tags:
      - Guild
      x-accepts:
      - application/json
components:
  schemas:
    BirthdayDTO:
      example:
        guildId: 0
        userId: 0
        month: 1
        day: 5
        zoneId: zoneId
      properties:
        guildId:
          description: The guild ID of the birthday person
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        userId:
          description: The user ID of the birthday person
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        month:
          description: The birth month
          format: int32
          type: integer
        day:
          description: The birth day
          format: int32
          type: integer
        zoneId:
          description: The GMT/UTC/UT or Region based Zone ID pf the birthday person
          type: string
      required:
      - day
      - guildId
      - month
      - userId
      - zoneId
    BirthdayScheduleDTO:
      example:
        guildId: 0
        userId: 0
        upcomingBirthdayAt: ""
      properties:
        guildId:
          description: The guild ID of the birthday person
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        userId:
          description: The user ID of the birthday person
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        upcomingBirthdayAt:
          allOf:
          - $ref: "#/components/schemas/Instant"
          description: Upcoming birth date and time of the birthday person
      required:
      - guildId
      - upcomingBirthdayAt
      - userId
    ErrorResponse:
      description: Standard API error response
      example:
        status: 0
        error: error
        message: message
        timeStamp: ""
        path: path
      properties:
        status:
          format: int32
          readOnly: true
          type: integer
        error:
          readOnly: true
          type: string
        message:
          readOnly: true
          type: string
        timeStamp:
          allOf:
          - $ref: "#/components/schemas/OffsetDateTime"
          readOnly: true
        path:
          readOnly: true
          type: string
      required:
      - error
      - message
      - path
      - status
      - timeStamp
    GuildDTO:
      example:
        guildId: 0
        channelId: 0
        roleId: 0
      properties:
        guildId:
          description: Discord guild/server ID
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        channelId:
          description: Discord channel ID where birthday notifications are sent
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
        roleId:
          description: Discord role ID to ping when birthday notifications are sent
          exclusiveMinimum: true
          format: int64
          minimum: 0
          type: integer
      required:
      - channelId
      - guildId
    Instant:
      format: date-time
      type: string
    OffsetDateTime:
      format: date-time
      type: string

